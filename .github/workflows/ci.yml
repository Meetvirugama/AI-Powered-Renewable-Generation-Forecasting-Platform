name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch. During a sprint the queue is the
# scarce resource, not the compute.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write          # required for OIDC; no long-lived AWS keys anywhere

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: renewable-backend

jobs:
  # Fast gate, runs on every push to every branch. Target: under two minutes.
  # It deliberately does NOT install requirements-ml.txt -- torch plus the bge-m3
  # weights is ~3 GB, and a CI job that slow gets switched off by week two, which
  # is indistinguishable from having no CI.
  test:
    name: lint + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: renewable
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: renewable_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renewable"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # The suite itself runs on in-memory SQLite (tests/conftest.py). This URL
      # is what opts in the pgvector integration tests, which cover the SQL that
      # actually runs in production and cannot be exercised on SQLite.
      TEST_DATABASE_URL: postgresql+psycopg2://renewable:testpass@localhost:5432/renewable_test
      # Deterministic hash vectors and a canned LLM: the whole graph runs with no
      # weights, no API key and no network.
      RAG_EMBED_BACKEND: mock
      RAG_PRIMARY_MODEL: mock
      RAG_ENABLE_RERANKER: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        # Uses the selection in pyproject.toml, so a clean local `ruff check .`
        # means a green build here.
        run: ruff check .

      - name: Test
        # -m "not slow" skips anything that needs real model weights.
        run: pytest tests/ -v --tb=short -m "not slow"

  # Runs on every push once `test` passes, not just on main.
  #
  # It used to be gated on `github.ref == 'refs/heads/main' || github.base_ref
  # == 'main'`, meant to also cover PRs targeting main. That never worked: for a
  # PR whose head and base are in the same repo (the normal case here, not a
  # fork), GitHub collapses the push and pull_request events for one commit into
  # a single push-triggered run, and github.base_ref is only ever set on a
  # pull_request-triggered run. So the condition was permanently false for every
  # PR, and nobody's Dockerfile change was ever build-tested before it reached
  # main -- a change that broke the image (as one did: an apt mirror timeout
  # pulling build-essential, found only by building locally by hand) could sit
  # green through review and only fail once merged.
  #
  # Now it always builds; buildx's GHA cache (below) makes every run after the
  # first only re-pull the layers that changed, so this is not the 2.2 GB
  # download on every push that it would be without the cache. ECR push and the
  # AWS auth it needs stay restricted to main -- there is no reason to publish
  # an image for every branch push, only to prove it builds.
  image:
    name: build + scan image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          # Without this cache the model layer is rebuilt on every run, which is
          # a 2.2 GB download each time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          # Report, do not block. Over a 14-day sprint a base-image CVE with no
          # available fix would otherwise stop every deploy; the report is still
          # read, and this is a deliberate, revisitable call.
          exit-code: "0"
          format: table

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker tag "$ECR_REPOSITORY:${{ github.sha }}" "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker tag "$ECR_REPOSITORY:${{ github.sha }}" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
