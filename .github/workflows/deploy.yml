name: deploy

# Runs only after ci succeeds on main. Chaining on workflow_run rather than
# duplicating the test steps means there is exactly one definition of "green".
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:          # manual rollback / redeploy

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a half-finished rollout

permissions:
  contents: read
  id-token: write             # OIDC. No AWS access keys are stored in this repo.

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The trust policy on this role pins
          #   token.actions.githubusercontent.com:sub
          # to repo:<ORG>/<REPO>:ref:refs/heads/main.
          # Without that condition ANY repository on GitHub can assume the role.
          # It is the most copy-pasted security hole in Actions setups; see
          # docs/deployment.md for the exact policy.
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll the backend on EC2
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          # SSM RunCommand, not SSH: no key pair in GitHub secrets, no bastion,
          # no port 22 open anywhere, and every command is audited in CloudTrail.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $IMAGE_TAG" \
            --parameters "commands=[
              'set -euo pipefail',
              'cd /opt/renewable',
              'bash infra/docker/fetch_secrets.sh',
              'export IMAGE_TAG=$IMAGE_TAG',
              'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}',
              'docker compose -f docker-compose.prod.yml pull backend',
              'docker compose -f docker-compose.prod.yml up -d --no-deps backend',
              'for i in \$(seq 1 30); do curl -fsS http://localhost:8000/health >/dev/null && echo healthy && exit 0; sleep 5; done; echo health check timed out; docker compose -f docker-compose.prod.yml logs --tail 50 backend; exit 1'
            ]" \
            --query 'Command.CommandId' --output text)

          echo "ssm command: $CMD_ID"

          # The health loop is 30 x 5s because the container loads bge-m3 before
          # it can serve. Without the wait, a deploy reports success while the
          # container is still loading and the next dashboard request gets a 502.
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi

      - name: Verify the RAG corpus survived the roll
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # A backend that is "healthy" with an empty corpus still answers, just
          # without citations. Worth catching here rather than on stage.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["curl -fsS http://localhost:8000/rag/health"]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
