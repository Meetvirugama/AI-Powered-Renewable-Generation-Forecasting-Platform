name: deploy

# Runs only after ci succeeds on main, so there is exactly one definition of
# "green" and a failing test cannot reach the server.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:          # manual redeploy / rollback

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a half-finished rollout

permissions:
  contents: read

jobs:
  deploy:
    # Skipped automatically when the SSH key secret is absent, so a fork or a
    # fresh clone does not fail CI on infrastructure it has no access to.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check deployment secrets are configured
        id: secrets
        env:
          HOST: ${{ secrets.AZURE_VM_HOST }}
          KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_VM_HOST / AZURE_SSH_PRIVATE_KEY not set - skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authorise SSH
        if: steps.secrets.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key rather than using StrictHostKeyChecking=no, so a
          # man-in-the-middle cannot silently receive the deploy.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to the Azure VM
        if: steps.secrets.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.AZURE_VM_HOST }}
          USER: ${{ secrets.AZURE_VM_USER }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 "${USER:-azureuser}@$HOST" bash -euo pipefail <<REMOTE
            cd ~/AI-Powered-Renewable-Generation-Forecasting-Platform

            # Record what we are rolling back FROM, before changing anything.
            PREVIOUS=\$(git rev-parse HEAD)
            echo "current: \$PREVIOUS"

            git fetch origin main --quiet
            git checkout main --quiet
            git reset --hard origin/main --quiet
            echo "deploying: \$(git rev-parse --short HEAD)"

            # Only reinstall when the dependency files actually changed --
            # a full pip install on every deploy adds minutes for nothing.
            if ! git diff --quiet "\$PREVIOUS" HEAD -- requirements.txt; then
              echo "requirements.txt changed, installing"
              venv/bin/python -m pip install -q -r requirements.txt
            else
              echo "requirements.txt unchanged, skipping install"
            fi

            sudo systemctl restart renewable-api
            echo "\$PREVIOUS" > /tmp/previous_deploy_sha
          REMOTE

      - name: Wait for health, roll back on failure
        if: steps.secrets.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.AZURE_VM_HOST }}
          USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 "${USER:-azureuser}@$HOST" bash <<'REMOTE'
            for i in $(seq 1 24); do
              if curl -fsS --max-time 5 http://localhost:8000/health >/dev/null 2>&1; then
                echo "healthy after ${i} attempts"
                curl -s http://localhost:8000/health
                exit 0
              fi
              sleep 5
            done

            echo "health check failed; rolling back"
            cd ~/AI-Powered-Renewable-Generation-Forecasting-Platform
            git reset --hard "$(cat /tmp/previous_deploy_sha)" --quiet
            sudo systemctl restart renewable-api
            sleep 15
            echo "--- logs from the failed release ---"
            sudo journalctl -u renewable-api -n 40 --no-pager
            exit 1
          REMOTE

      - name: Confirm the public endpoint and engine modes
        if: steps.secrets.outputs.configured == 'true'
        env:
          PUBLIC_URL: ${{ secrets.AZURE_PUBLIC_URL }}
        run: |
          URL="${PUBLIC_URL:-https://57.159.24.68.nip.io}"
          echo "checking $URL/health"
          curl -fsS --max-time 20 "$URL/health"
          echo
          # Not a gate: a mock engine is a legitimate configuration. Printing it
          # means nobody has to wonder afterwards which engines a release served.
          curl -fsS --max-time 20 "$URL/health" \
            | grep -o '"serving_synthetic_data":\[[^]]*\]' || true
